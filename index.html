<style>
:root{
  --terracota:#c46a4a; --terracota-hover:#aa593f; --dorado:#d6b36a;
  --arena:#f7f3ef; --texto:#3a2f2a; --suave:#7c6a60; --olivo:#6b7b3f;
  --borde:#e8ded4; --radio:1rem;
  --sombra:0 6px 20px rgba(58,47,42,.08);
  --sombra-alta:0 14px 40px rgba(58,47,42,.18);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--arena);color:var(--texto);font-family:"Poppins",system-ui,sans-serif;font-weight:300;overflow-x:hidden}
.script{font-family:"Great Vibes",cursive;font-weight:400}
img{max-width:100%;display:block}
button{font-family:inherit}

/* PORTADA */
#portada{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:20px;color:#fff;background-size:cover;background-position:center}
#portada h1{font-size:clamp(3rem,12vw,4.5rem);margin:0}
#portada p{letter-spacing:.2em;margin:.5rem 0 0}
.btn{display:inline-block;border:0;cursor:pointer;border-radius:999px;background:var(--terracota);color:#fff;
  padding:.85rem 2rem;font-size:.95rem;text-decoration:none;transition:.25s;box-shadow:var(--sombra-alta)}
.btn:hover{background:var(--terracota-hover);transform:translateY(-2px)}
.btn.sec{background:#fff;color:var(--texto);border:1px solid var(--borde);box-shadow:none}
.btn:disabled{opacity:.6;cursor:default}
#portada .btn{margin-top:2rem;padding:1rem 2.5rem}

/* HERO */
header.hero{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;color:#fff;padding:20px;background-size:cover;background-position:center}
header.hero .tag{letter-spacing:.35em;font-size:.8rem}
header.hero h1{font-family:"Great Vibes",cursive;font-size:clamp(3rem,12vw,4.5rem);margin:.4rem 0 0}
header.hero .frase{max-width:32rem;font-size:.9rem;opacity:.92}

/* CONTADOR */
.contador{display:flex;gap:.6rem;margin-top:1.8rem;flex-wrap:wrap;justify-content:center}
.contador div{background:rgba(255,255,255,.18);backdrop-filter:blur(6px);border-radius:.9rem;padding:.7rem 1rem;min-width:74px}
.contador b{display:block;font-size:1.5rem;font-weight:500}
.contador span{font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;opacity:.9}

/* SECCIONES */
section{max-width:64rem;margin:0 auto;padding:4rem 1.25rem;text-align:center;
  opacity:0;transform:translateY(28px);transition:opacity .9s ease,transform .9s ease}
section.visible{opacity:1;transform:none}
h2{color:var(--terracota);font-weight:500;font-size:clamp(1.35rem,4.5vw,1.9rem);margin:0}
.linea{width:5rem;height:3px;border-radius:99px;margin:.8rem auto 0;background:linear-gradient(90deg,var(--dorado),var(--terracota))}
.sub{color:var(--suave);font-size:.9rem;max-width:34rem;margin:1rem auto 0}
.padres p{font-family:"Great Vibes",cursive;font-size:clamp(1.7rem,7vw,2.3rem);margin:.35rem 0}

/* TARJETAS */
.grid{display:grid;gap:1.1rem;margin-top:2.5rem;grid-template-columns:1fr}
@media(min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1024px){.grid{grid-template-columns:repeat(3,1fr)}}
.tarjeta{background:#fff;border:1px solid var(--borde);border-radius:1.25rem;padding:1.75rem 1.25rem;
  box-shadow:var(--sombra);display:flex;flex-direction:column;align-items:center;gap:.5rem;transition:.25s}
.tarjeta:hover{transform:translateY(-4px);box-shadow:var(--sombra-alta)}
.tarjeta .ico{font-size:2rem}
.tarjeta h3{margin:0;font-weight:500;font-size:1.05rem}
.tarjeta .res{color:var(--suave);font-size:.85rem;margin:0}
.tarjeta .btn{margin-top:.9rem;padding:.6rem 1.6rem;font-size:.85rem}

/* MODAL */
.overlay{position:fixed;inset:0;z-index:70;background:rgba(30,22,18,.55);display:none;
  align-items:center;justify-content:center;padding:1rem}
.overlay.abierto{display:flex}
.modal{background:var(--arena);border-radius:1.25rem;max-width:32rem;width:100%;max-height:88svh;overflow:auto;
  padding:1.75rem 1.4rem;position:relative;box-shadow:var(--sombra-alta);animation:sube .25s ease}
@keyframes sube{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.modal h3{color:var(--terracota);text-align:center;margin:0 0 1rem;font-weight:500;font-size:1.25rem}
.cerrar{position:absolute;top:.7rem;right:.7rem;border:0;background:#fff;border-radius:999px;width:2rem;height:2rem;
  cursor:pointer;font-size:1rem;color:var(--suave);box-shadow:var(--sombra)}
.modal p{margin:.35rem 0}
.modal .centro{text-align:center}
.tenue{color:var(--suave);font-size:.88rem}
iframe{width:100%;height:220px;border:0;border-radius:1rem;margin:1rem 0}
.fila{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin-top:.6rem}
.item{display:flex;justify-content:space-between;align-items:center;background:#fff;border-left:4px solid var(--terracota);
  border-radius:.8rem;padding:.75rem 1rem;margin-bottom:.5rem}
.cuenta{background:#fff;border-left:4px solid var(--terracota);border-radius:.9rem;padding:1rem;margin:.7rem 0;text-align:left;font-size:.9rem}
.colores{display:flex;flex-wrap:wrap;gap:1.2rem;justify-content:center;margin-top:1rem}
.colores div{text-align:center;font-size:.72rem;color:var(--suave)}
.colores i{display:block;width:3rem;height:3rem;border-radius:999px;border:1px solid var(--borde);margin-bottom:.4rem;box-shadow:var(--sombra)}

/* FORM */
form{display:flex;flex-direction:column;gap:.7rem}
input,select{border:1px solid var(--borde);background:#fff;border-radius:.8rem;padding:.8rem 1rem;font-size:.9rem;
  font-family:inherit;color:var(--texto);outline:none}
input:focus,select:focus{border-color:var(--terracota)}

/* GALERIA */
.galeria{position:relative;max-width:44rem;margin:2rem auto 0}
.galeria-marco{position:relative;overflow:hidden;border-radius:1.25rem;box-shadow:var(--sombra-alta);background:#fff}
.galeria img{width:100%;height:320px;object-fit:cover;transition:opacity .4s ease}
.galeria-btn{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:2.8rem;height:2.8rem;
  border:0;border-radius:999px;background:rgba(255,255,255,.9);color:var(--terracota);font-size:2rem;
  line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:var(--sombra);transition:.2s}
.galeria-btn:hover{background:var(--terracota);color:#fff;transform:translateY(-50%) scale(1.05)}
.galeria-btn.anterior{left:.75rem}
.galeria-btn.siguiente{right:.75rem}
.galeria-indicadores{display:flex;justify-content:center;gap:.45rem;margin-top:1rem}
.galeria-indicador{width:.55rem;height:.55rem;border:0;border-radius:999px;background:var(--borde);
  padding:0;cursor:pointer;transition:.25s}
.galeria-indicador.activo{width:1.5rem;background:var(--terracota)}
@media(min-width:640px){.galeria img{height:460px}}
@media(max-width:380px){.galeria img{height:280px}.galeria-btn{width:2.5rem;height:2.5rem}}

footer{background:#fff;text-align:center;padding:2.5rem 1rem;color:var(--suave);font-size:.85rem;margin-top:2rem}

/* FLOTANTES */
.flotante{position:fixed;bottom:1.25rem;z-index:50;width:3.4rem;height:3.4rem;border-radius:999px;border:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:1.3rem;color:#fff;box-shadow:var(--sombra-alta);
  text-decoration:none;transition:.2s}
.flotante:hover{transform:scale(1.07)}
#btnMusica{right:1.25rem;background:var(--terracota)}
#btnWhats{left:1.25rem;background:var(--olivo)}

/* PETALOS */
.petalo{position:fixed;top:-40px;font-size:1.1rem;pointer-events:none;z-index:5;animation:caer linear forwards;opacity:.85}
@keyframes caer{to{transform:translateY(105svh) rotate(360deg);opacity:0}}
@media(prefers-reduced-motion:reduce){.petalo{display:none}section{opacity:1;transform:none}}

.volver-arriba {
  text-align: center;
  margin: 35px 0 45px;
}

.volver-arriba button {
  background: transparent;
  border: 1px solid var(--terracota);
  color: var(--terracota);
  padding: 10px 22px;
  border-radius: 25px;
  font-family: 'Poppins', sans-serif;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.3s ease;
}

.volver-arriba button:hover {
  background: var(--terracota);
  color: white;
  transform: translateY(-2px);
}

/* Transición y animación para el fade + zoom de la portada */
#portada {
  transition: opacity 0.8s ease, transform 0.8s ease, visibility 0.8s;
  will-change: opacity, transform;
}

#portada.ocultar {
  opacity: 0;
  transform: scale(1.15); /* Efecto de zoom hacia adelante */
  pointer-events: none;    /* Desactiva los clics mientras desaparece */
}
</style>
</head>

     3) LÓGICA (normalmente no necesitas tocar nada de aquí)

<script>
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const wa = "https://wa.me/" + BODA.whatsapp;

/* Textos base */
$("#p-nombres").textContent = BODA.parejaCorta;
$("#p-fecha").textContent   = BODA.fechaTexto;
$("#h-nombres").textContent = BODA.parejaCorta;
$("#h-frase").textContent   = BODA.frase;
$("#historia").textContent  = BODA.historia;
$("#cierre").textContent    = BODA.cierre;
$("#footer").textContent    = `Con amor, ${BODA.novio} & ${BODA.novia} 💍`;
$("#audio").src = BODA.musica;
$("#btnWhats").href = wa;
document.title = `Save the Date | ${BODA.parejaCorta}`;
$("#portada").style.backgroundImage = `linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),url(${BODA.fondoPortada})`;
$("#hero").style.backgroundImage    = `linear-gradient(rgba(0,0,0,.4),rgba(0,0,0,.4)),url(${BODA.fondoHero})`;
$("#padres").innerHTML  = BODA.padres.map(p => `<p>${esc(p)}</p>`).join("");

/* Galería */
let indiceGaleria = 0;
const fotoGaleria = $("#fotoGaleria");
const indicadoresGaleria = $("#galeriaIndicadores");

function mostrarFoto(indice){
  if (!BODA.galeria.length) return;
  indiceGaleria = (indice + BODA.galeria.length) % BODA.galeria.length;

  fotoGaleria.style.opacity = "0";
  setTimeout(() => {
    fotoGaleria.src = BODA.galeria[indiceGaleria];
    fotoGaleria.alt = `Foto ${indiceGaleria + 1} de ${BODA.parejaCorta}`;
    fotoGaleria.style.opacity = "1";
  }, 150);

  indicadoresGaleria.querySelectorAll("button").forEach((b, i) => {
    b.classList.toggle("activo", i === indiceGaleria);
  });
}

indicadoresGaleria.innerHTML = BODA.galeria.map((f, i) =>
  `<button class="galeria-indicador${i === 0 ? " activo" : ""}" type="button"
    aria-label="Ver foto ${i + 1}" data-foto="${i}"></button>`
).join("");

$("#galeriaAnterior").onclick = () => mostrarFoto(indiceGaleria - 1);
$("#galeriaSiguiente").onclick = () => mostrarFoto(indiceGaleria + 1);

indicadoresGaleria.addEventListener("click", e => {
  const boton = e.target.closest("[data-foto]");
  if (boton) mostrarFoto(+boton.dataset.foto);
});

mostrarFoto(0);

let intervaloGaleria = setInterval(() => mostrarFoto(indiceGaleria + 1), 5000);

$("#galeria").addEventListener("mouseenter", () => clearInterval(intervaloGaleria));
$("#galeria").addEventListener("mouseleave", () => {
  clearInterval(intervaloGaleria);
  intervaloGaleria = setInterval(() => mostrarFoto(indiceGaleria + 1), 5000);
});
     
/* Contador */
const objetivo = new Date(BODA.fechaISO).getTime();
function tick(){
  const d = Math.max(0, objetivo - Date.now());
  const dias = Math.floor(d/86400000), h = Math.floor(d/3600000)%24, m = Math.floor(d/60000)%60, s = Math.floor(d/1000)%60;
  const p = (n) => String(n).padStart(2,"0");
  $("#contador").innerHTML = [[p(dias),"Días"],[p(h),"Horas"],[p(m),"Min"],[p(s),"Seg"]]
    .map(([v,l]) => `<div><b>${v}</b><span>${l}</span></div>`).join("");
}
tick(); setInterval(tick, 1000);

/* Tarjetas + contenido de cada modal */
const lugarHTML = (x) => `
  <p class="centro" style="font-size:1.05rem">${esc(x.lugar)}</p>
  <p class="centro tenue">${esc(BODA.fechaTexto)} · ${esc(x.hora)}</p>
  <iframe loading="lazy" title="Mapa de ${esc(x.lugar)}" src="${x.mapsEmbed}" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>
  <div class="fila">
    <a class="btn" href="${x.mapsLink}" target="_blank" rel="noreferrer">Cómo llegar</a>
    <button class="btn sec" data-copiar="${esc(x.lugar)}">Copiar dirección</button>
  </div>`;

const TARJETAS = [
  { ico:"⛪", titulo:BODA.ceremonia.titulo, resumen:`${BODA.ceremonia.lugar} · ${BODA.ceremonia.hora}`, cuerpo:() => lugarHTML(BODA.ceremonia) },
  { ico:"🥂", titulo:BODA.recepcion.titulo, resumen:`${BODA.recepcion.lugar} · ${BODA.recepcion.hora}`, cuerpo:() => lugarHTML(BODA.recepcion) },
  { ico:"🕒", titulo:"Itinerario", resumen:"El orden del gran día", cuerpo:() =>
      BODA.itinerario.map(e => `<div class="item"><span>${e.icono} ${esc(e.nombre)}</span><span class="tenue">${esc(e.hora)}</span></div>`).join("") },
  { ico:"👗", titulo:"Dresscode", resumen:BODA.dresscode.titulo, cuerpo:() => `
      <p class="centro" style="font-size:1.05rem">${esc(BODA.dresscode.titulo)}</p>
      <p class="centro tenue">${esc(BODA.dresscode.nota)}</p>
      <div class="colores">${BODA.dresscode.coloresReservados.map(c =>
        `<div><i style="background:${c.hex}"></i>${esc(c.nombre)}</div>`).join("")}</div>` },
  { ico:"🎁", titulo:"Obsequios", resumen:"Efectivo, transferencia o Diunsa", cuerpo:() => `
      ${BODA.regalos.intro.map(p => `<p class="centro tenue">${esc(p)}</p>`).join("")}
      ${BODA.regalos.cuentas.map(c => `<div class="cuenta">
          <p style="font-weight:500">${esc(c.cliente)}</p>
          <p class="tenue">Banco: ${esc(c.banco)}</p>
          <p class="tenue">Cuenta: ${esc(c.numero)}</p>
          <div class="fila" style="justify-content:flex-start"><button class="btn sec" data-copiar="${esc(c.numero)}">Copiar cuenta</button></div>
        </div>`).join("")}
      <p class="centro tenue">${esc(BODA.regalos.nota)}</p>` },
  { ico:"💌", titulo:"Confirmar asistencia", resumen:"Déjanos saber si nos acompañas", cuerpo:() => `
      <form id="rsvp">
        <input name="nombre" placeholder="Tu nombre" required />
        <input name="invitados" type="number" min="1" placeholder="Cantidad de invitados" required />
        <select name="asistencia"><option>Confirmo asistencia</option><option>No podré asistir</option></select>
        <input name="mensaje" placeholder="Mensaje para los novios" />
        <button class="btn" type="submit">Confirmar asistencia</button>
        <p>Tambien puedes confirmar dandole al botón de whatsapp y te llevará directamente a enviarnos un mensaje</p>
      </form>` }
];

$("#tarjetas").innerHTML = TARJETAS.map((t,i) => `
  <article class="tarjeta">
    <div class="ico">${t.ico}</div>
    <h3>${esc(t.titulo)}</h3>
    <p class="res">${esc(t.resumen)}</p>
    <button class="btn" data-abrir="${i}">Ver más</button>
  </article>`).join("");

/* Modal */
const overlay = $("#overlay");
function abrirModal(i){
  const t = TARJETAS[i];
  $("#modalTitulo").textContent = t.titulo;
  $("#modalCuerpo").innerHTML = t.cuerpo();
  overlay.classList.add("abierto");
  document.body.style.overflow = "hidden";
}
function cerrarModal(){
  overlay.classList.remove("abierto");
  $("#modalCuerpo").innerHTML = "";
  document.body.style.overflow = "";
}
$("#btnCerrar").onclick = cerrarModal;
overlay.addEventListener("click", e => { if (e.target === overlay) cerrarModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") cerrarModal(); });

document.addEventListener("click", async (e) => {
  const abrir = e.target.closest("[data-abrir]");
  if (abrir) return abrirModal(+abrir.dataset.abrir);

  const copiar = e.target.closest("[data-copiar]");
  if (copiar){
    try { await navigator.clipboard.writeText(copiar.dataset.copiar); } catch {}
    const txt = copiar.textContent;
    copiar.textContent = "¡Copiado!";
    setTimeout(() => copiar.textContent = txt, 1600);
  }
});

/* RSVP */
document.addEventListener("submit", async (e) => {
  if (e.target.id !== "rsvp") return;
  e.preventDefault();
  const form = e.target, btn = form.querySelector("button");
  btn.disabled = true; btn.textContent = "Enviando...";
  try { await fetch(BODA.rsvpURL, { method:"POST", mode:"no-cors", body:new FormData(form) }); } catch {}
  $("#modalCuerpo").innerHTML = `
    <div class="centro">
      <p style="color:var(--olivo);font-weight:500">✔ ¡Gracias! Recibimos tu respuesta.</p>
      <p class="tenue">Si quieres avisarnos algo más, escríbenos por WhatsApp.</p>
      <div class="fila"><a class="btn" href="${wa}" target="_blank" rel="noreferrer">Escribir por WhatsApp</a></div>
    </div>`;
});

/* Portada, música y pétalos */
const audio = $("#audio");
let petalosOn = false;
$("#btnAbrir").onclick = () => {
  const portada = $("#portada");
  portada.classList.add("ocultar");
  audio.play().catch(() => {});
  petalosOn = true;
  setTimeout(() => {
    portada.remove();
  }, 800);
};
$("#btnMusica").onclick = () => { audio.paused ? audio.play().catch(()=>{}) : audio.pause(); };

const EMOJIS = ["🌸","🌷","💮","🌺"];
setInterval(() => {
  if (!petalosOn || document.hidden || document.querySelectorAll(".petalo").length > 12) return;
  const p = document.createElement("span");
  p.className = "petalo";
  p.textContent = EMOJIS[Math.floor(Math.random()*EMOJIS.length)];
  p.style.left = Math.random()*100 + "vw";
  p.style.animationDuration = (7 + Math.random()*5) + "s";
  document.body.appendChild(p);
  setTimeout(() => p.remove(), 12000);
}, 1200);

/* Aparición de secciones */
const obs = new IntersectionObserver(es => es.forEach(x => x.isIntersecting && x.target.classList.add("visible")), { threshold:.15 });
document.querySelectorAll("section").forEach(s => obs.observe(s));
</script>
</body>
</html>
